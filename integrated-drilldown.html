<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Insights Drilldown Prototype v6</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');

  :root {
    --ink:#111827;
    --muted:#687385;
    --bg:#f7f9fc;
    --card:#ffffff;
    --border:#e3e8ef;
    --score:#2563eb;
    --left:#edf2f7;
    --left-line:#cbd5e1;
    --green:#1f9d55;
    --red:#e5484d;
    --skip:#edf2f7;
    --skip-line:#cbd5e1;
    --warn:#f97316;
  }

  * { box-sizing:border-box; }

  body {
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans', Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .page {
    max-width:1120px;
    margin:24px auto;
    padding:0 16px;
  }

  .card {
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    box-shadow:0 8px 24px rgba(15,23,42,.07);
    padding:24px;
  }

  .header {
    display:flex;
    justify-content:space-between;
    gap:18px;
    align-items:flex-start;
    margin-bottom:16px;
  }

  h1 {
    margin:0;
    font-size:28px;
    line-height:1.15;
    letter-spacing:-0.02em;
  }

  .subtitle {
    margin-top:6px;
    color:var(--muted);
    font-size:14px;
  }

  .legend {
    display:flex;
    flex-wrap:wrap;
    justify-content:flex-end;
    gap:10px 16px;
    color:#374151;
    font-size:12px;
    max-width:520px;
  }

  .legend-item { display:flex; align-items:center; gap:6px; }

  .swatch {
    width:14px;
    height:14px;
    display:inline-block;
    border-radius:4px;
    border:1px solid rgba(0,0,0,.08);
  }

  .pattern-swatch {
    background:repeating-linear-gradient(135deg, var(--left) 0 5px, var(--left-line) 5px 7px, var(--left) 7px 12px);
  }

  .controls-row {
    display:flex;
    gap:12px;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    margin:12px 0 16px;
  }

  .breadcrumbs {
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:8px;
    color:var(--muted);
    font-size:13px;
    font-weight:600;
  }

  .crumb {
    border:1px solid #d1d8e0;
    background:#fff;
    border-radius:999px;
    padding:6px 10px;
    cursor:pointer;
    color:#374151;
    font-family:inherit;
  }

  .crumb.active {
    background:#111827;
    color:#fff;
    border-color:#111827;
  }

  .type-controls {
    display:grid;
    grid-template-columns:repeat(4, minmax(0,1fr));
    gap:8px;
    min-width:360px;
  }

  .filter-btn {
    border:1px solid #d1d8e0;
    background:#fff;
    color:#374151;
    border-radius:999px;
    padding:8px 12px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
    white-space:nowrap;
    text-align:center;
  }

  .filter-btn.active {
    background:#111827;
    color:#fff;
    border-color:#111827;
  }

  .chart-head {
    display:grid;
    gap:12px;
    align-items:center;
    color:var(--muted);
    font-size:12px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.04em;
    border-bottom:1px solid #eef2f7;
    padding-bottom:8px;
    text-align:center;
  }

  .chart-head div:first-child { text-align:left; }

  .row {
    display:grid;
    gap:12px;
    align-items:center;
    padding:13px 0;
    border-bottom:1px solid #f1f5f9;
  }

  .row:last-child { border-bottom:none; }

  .section-layout,
  .area-layout {
    grid-template-columns:220px 1fr;
  }

  .topic-layout {
    grid-template-columns:250px 1fr 140px 120px;
  }

  .name {
    font-weight:700;
    font-size:14px;
    line-height:1.25;
    cursor:default;
  }

  .name.clickable {
    cursor:pointer;
  }

  .name.clickable:hover {
    color:var(--score);
  }

  .sub {
    margin-top:3px;
    color:var(--muted);
    font-size:12px;
    font-weight:500;
  }

  .bar-area {
    position:relative;
    height:34px;
  }

  .bar-shell {
    position:absolute;
    left:0;
    top:7px;
    height:22px;
    border-radius:9px;
    overflow:hidden;
    background:#f3f4f6;
    border:1px solid #d1d5db;
    display:flex;
  }

  .segment {
    height:100%;
    cursor:pointer;
    position:relative;
  }

  .segment:hover { filter:brightness(.94); }

  .seg-score { background:var(--score); }

  .seg-left {
    background:repeating-linear-gradient(135deg, var(--left) 0 6px, var(--left-line) 6px 8px, var(--left) 8px 13px);
  }

  .seg-green { background:var(--green); }

  .seg-red { background:var(--red); }

  .seg-skip {
    background:repeating-linear-gradient(135deg, var(--skip) 0 6px, var(--skip-line) 6px 8px, var(--skip) 8px 13px);
  }

  .seg-label {
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    font-size:12px;
    font-weight:700;
    white-space:nowrap;
    pointer-events:none;
  }

  .score-label,
  .green-label,
  .red-label {
    color:#fff;
    text-shadow:0 1px 2px rgba(0,0,0,.20);
  }

  .left-label,
  .skip-label {
    color:#334155;
  }

  .bar-value {
    position:absolute;
    left:calc(100% + 7px);
    top:2px;
    font-weight:700;
    font-size:12px;
    color:#374151;
    white-space:nowrap;
  }

  .metric {
    text-align:center;
    font-weight:700;
    color:#111827;
    font-size:13px;
    line-height:1.25;
  }

  .metric span {
    color:var(--muted);
    font-weight:600;
  }

  .return-pill {
    border-radius:999px;
    padding:5px 8px;
    font-size:12px;
    font-weight:700;
    text-align:center;
    white-space:nowrap;
    cursor:pointer;
  }

  .return-pill:hover {
    filter:brightness(.96);
  }

  .info-dot {
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:15px;
    height:15px;
    margin-left:5px;
    border-radius:999px;
    background:rgba(255,255,255,.75);
    color:#111827;
    font-size:10px;
    font-weight:700;
    vertical-align:middle;
  }

  .return-good {
    background:rgba(31,157,85,.13);
    color:#13713d;
    border:1px solid rgba(31,157,85,.25);
  }

  .return-low {
    background:rgba(229,72,77,.12);
    color:#a92f35;
    border:1px solid rgba(229,72,77,.25);
  }

  .return-mid {
    background:rgba(249,115,22,.12);
    color:#9a4d07;
    border:1px solid rgba(249,115,22,.25);
  }

  .return-none {
    background:#f8fafc;
    color:var(--muted);
    border:1px solid #e5e7eb;
  }

  .hover-tip {
    position:fixed;
    z-index:9999;
    display:none;
    max-width:360px;
    white-space:pre-line;
    background:#111827;
    color:#fff;
    border-radius:10px;
    padding:10px 12px;
    font-size:12px;
    line-height:1.45;
    box-shadow:0 12px 28px rgba(15,23,42,.28);
    pointer-events:none;
  }

  .empty {
    color:var(--muted);
    font-size:14px;
    padding:22px 0;
  }

  .footnote {
    color:var(--muted);
    font-size:12px;
    margin-top:12px;
    line-height:1.45;
  }

  @media (max-width:960px) {
    .topic-layout {
      grid-template-columns:1fr;
      gap:8px;
    }

    .topic-layout.chart-head {
      display:none;
    }

    .metric {
      text-align:left;
    }
  }

  @media (max-width:760px) {
    .card { padding:18px; }

    .header {
      flex-direction:column;
      gap:12px;
    }

    .legend {
      justify-content:flex-start;
      max-width:none;
    }

    .controls-row {
      align-items:stretch;
    }

    .type-controls {
      width:100%;
      min-width:0;
      grid-template-columns:repeat(4, minmax(0,1fr));
      gap:6px;
    }

    .section-layout,
    .area-layout {
      grid-template-columns:1fr;
      gap:8px;
    }

    .section-layout.chart-head,
    .area-layout.chart-head {
      display:none;
    }

    .row {
      padding:14px 0 12px;
    }

    h1 { font-size:24px; }

    .subtitle { font-size:13px; }

    .bar-shell {
      max-width:100%;
    }
  }

  @media (max-width:380px) {
    .type-controls {
      grid-template-columns:repeat(4, minmax(0,1fr));
      gap:5px;
    }

    .filter-btn {
      padding:8px 6px;
      font-size:12px;
    }

    .seg-label {
      font-size:11px;
    }
  }
</style>
</head>

let currentLevel = "section";
let selectedSection = null;
let selectedArea = null;
let currentType = "All";
const hoverTip = document.getElementById("hoverTip");

const AREA_SHORT = {
  "Reading Comprehension": "RC",
  "Verbal Ability": "VA",
  "Data Interpretation": "DI",
  "Logical Reasoning": "LR",
  "Numbers": "Num",
  "Arithmetic": "Arith",
  "Algebra": "Alg",
  "Geometry": "Geo",
  "Modern Math": "Mod Math"
};

function shortLabel(name) {
  return AREA_SHORT[name] || name;
}

function pct(value, base) {
  return base ? Math.max(0, value / base * 100) : 0;
}

function showTip(text, event) {
  hoverTip.textContent = text;
  hoverTip.style.display = "block";
  positionTip(event);
}

function positionTip(event) {
  const margin = 12;
  const rect = hoverTip.getBoundingClientRect();
  let clientX = event.clientX;
  let clientY = event.clientY;

  if ((clientX === 0 && clientY === 0) || clientX === undefined || clientY === undefined) {
    const targetRect = event.target.getBoundingClientRect();
    clientX = targetRect.left + targetRect.width / 2;
    clientY = targetRect.top + targetRect.height / 2;
  }

  let x = clientX + 12;
  let y = clientY + 12;

  if (x + rect.width > window.innerWidth - margin) x = clientX - rect.width - 12;
  if (y + rect.height > window.innerHeight - margin) y = clientY - rect.height - 12;
  if (x < margin) x = margin;
  if (y < margin) y = margin;

  hoverTip.style.left = x + "px";
  hoverTip.style.top = y + "px";
}

function hideTip() {
  hoverTip.style.display = "none";
}

function segment(text, cls, widthPct, label, labelClass="") {
  if (widthPct <= 0) return "";
  const safe = text.replace(/`/g, "\\`");
  const labelHtml = label !== null && label !== undefined && label !== "" ? `<span class="seg-label ${labelClass}">${label}</span>` : "";
  return `<div class="segment ${cls}" style="width:${widthPct}%" onmouseenter="showTip(\`${safe}\`, event)" onmousemove="positionTip(event)" onmouseleave="hideTip()" onclick="showTip(\`${safe}\`, event)">${labelHtml}</div>`;
}

function setType(t) {
  currentType = t;
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  document.getElementById("type-" + t).classList.add("active");
  render();
}

function goSection() {
  currentLevel = "section";
  selectedSection = null;
  selectedArea = null;
  render();
}

function goArea(section) {
  currentLevel = "area";
  selectedSection = section;
  selectedArea = null;
  render();
}

function goTopic(area) {
  currentLevel = "topic";
  selectedArea = area;
  render();
}

function renderBreadcrumbs() {
  const b = document.getElementById("breadcrumbs");
  let html = `<button class="crumb ${currentLevel === "section" ? "active" : ""}" onclick="goSection()">Sections</button>`;
  if (selectedSection) {
    html += `<span>›</span><button class="crumb ${currentLevel === "area" ? "active" : ""}" onclick="goArea('${selectedSection}')">${selectedSection}</button>`;
  }
  if (selectedArea) {
    html += `<span>›</span><button class="crumb active">${shortLabel(selectedArea)}</button>`;
  }
  b.innerHTML = html;
}

function maxFor(rows, field) {
  return Math.max(...rows.map(r => r[field] || 0), 1);
}

function scoreBar(r, maxAvail) {
  const widthPct = pct(r.available, maxAvail);
  const scorePct = pct(Math.max(r.score,0), r.available);
  const leftPct = pct(Math.max(r.available - Math.max(r.score,0),0), r.available);
  const tip = `${r.score}/${r.available} scored\n${r.marks_left} marks left\n${r.correct_q} correct, ${r.incorrect_q} incorrect, ${r.skipped_q} skipped`;

  return `
    <div class="bar-area">
      <div class="bar-shell" style="width:${widthPct}%">
        ${segment(tip, "seg-score", scorePct, r.score > 0 ? r.score : "", "score-label")}
        ${segment(tip, "seg-left", leftPct, r.marks_left, "left-label")}
        <span class="bar-value">${r.available}</span>
      </div>
    </div>
  `;
}

function historyBar(r, maxTotal) {
  const widthPct = pct(r.hist_total, maxTotal);
  const cPct = pct(r.hist_correct, r.hist_total);
  const wPct = pct(r.hist_incorrect, r.hist_total);
  const sPct = pct(r.hist_skipped, r.hist_total);
  const tip = `${r.topic}\nCumulative history: ${r.hist_correct} correct, ${r.hist_incorrect} incorrect, ${r.hist_skipped} skipped\nAppeared in ${r.appeared_tests}/5 tests`;

  return `
    <div class="bar-area">
      <div class="bar-shell" style="width:${widthPct}%">
        ${segment(tip, "seg-green", cPct, r.hist_correct || "", "green-label")}
        ${segment(tip, "seg-red", wPct, r.hist_incorrect || "", "red-label")}
        ${segment(tip, "seg-skip", sPct, r.hist_skipped || "", "skip-label")}
        <span class="bar-value">${r.hist_total}</span>
      </div>
    </div>
  `;
}

function returnClass(mpm) {
  if (mpm === null || mpm === undefined) return "return-none";
  if (mpm >= 0.75) return "return-good";
  if (mpm > 0) return "return-mid";
  return "return-low";
}

function returnText(r) {
  if (r.current_return_mpm === null || r.current_return_mpm === undefined) return "No current time";
  return `${r.current_time_min.toFixed(1)} min · ${r.current_return_mpm.toFixed(2)} MPM`;
}

function timeTip(r) {
  if (r.current_return_mpm === null || r.current_return_mpm === undefined) {
    return `What this means\n${r.topic}\nNo current-test time found for this topic in the selected view.`;
  }

  const correctMarks = (r.current_correct_q || 0) * 3;
  return `What this means\n` +
    `${r.topic}\n` +
    `Time spent in current test: ${r.current_time_min.toFixed(1)} min\n` +
    `Questions counted here: ${r.current_available_q || 0}\n` +
    `${r.current_correct_q || 0} correct, ${r.current_incorrect_q || 0} incorrect, ${r.current_skipped_q || 0} skipped\n` +
    `MPM = converted marks ÷ time = ${correctMarks} ÷ ${r.current_time_min.toFixed(1)} = ${r.current_return_mpm.toFixed(2)}`;
}

function sortCurrent(rows) {
  return [...rows].sort((a,b) =>
    (b.score / b.available - a.score / a.available) ||
    (b.available - a.available) ||
    ((a.area || a.section || "").localeCompare(b.area || b.section || ""))
  );
}

function sortTopics(rows) {
  return [...rows].filter(r => r.hist_total > 0).sort((a,b) =>
    (b.hist_correct / b.hist_total - a.hist_correct / a.hist_total) ||
    (b.appeared_tests - a.appeared_tests) ||
    (b.hist_total - a.hist_total) ||
    a.topic.localeCompare(b.topic)
  );
}

function renderSections() {
  const rows = sortCurrent(payload.sectionRows[currentType]);
  document.getElementById("chartHead").className = "chart-head section-layout";
  document.getElementById("chartHead").innerHTML = `<div>Section</div><div>Score vs marks left</div>`;
  const maxAvail = maxFor(rows, "available");

  document.getElementById("chart").innerHTML = rows.map(r => {
    const readiness = currentType === "All" && payload.sectionReadiness[r.section] ? payload.sectionReadiness[r.section].percentile + " · " + payload.sectionReadiness[r.section].status : "";
    return `
      <div class="row section-layout">
        <div class="name clickable" onclick="goArea('${r.section}')">${r.section}<div class="sub">${readiness || "Click to view areas"}</div></div>
        ${scoreBar(r, maxAvail)}
      </div>
    `;
  }).join("");

  document.getElementById("footnote").textContent = "Sections are ordered by current score conversion. Bars use approved current selection snapshots.";
}

function renderAreas() {
  const rows = sortCurrent(payload.areaRows[currentType].filter(r => r.section === selectedSection));
  document.getElementById("chartHead").className = "chart-head area-layout";
  document.getElementById("chartHead").innerHTML = `<div>Area</div><div>Score vs marks left</div>`;
  const maxAvail = maxFor(rows, "available");

  document.getElementById("chart").innerHTML = rows.map(r => `
    <div class="row area-layout">
      <div class="name clickable" onclick="goTopic('${r.area}')">${shortLabel(r.area)}<div class="sub">${r.area} · click to view topics</div></div>
      ${scoreBar(r, maxAvail)}
    </div>
  `).join("") || `<div class="empty">No rows for this view.</div>`;

  document.getElementById("footnote").textContent = "Areas are ordered by current score conversion. Click an area to view cumulative topic performance.";
}

function renderTopics() {
  const rows = sortTopics(payload.topicRows[currentType].filter(r => r.area === selectedArea));
  document.getElementById("chartHead").className = "chart-head topic-layout";
  document.getElementById("chartHead").innerHTML = `<div>Topic</div><div>Cumulative performance</div><div>Current time return</div><div>Leakage + recurrence</div>`;
  const maxTotal = maxFor(rows, "hist_total");

  document.getElementById("chart").innerHTML = rows.map(r => {
    const recurTip = `${r.topic}\nHas been leaking approx. ${r.opp_per_test} marks/test when seen\n${r.hist_missed} not converted across ${r.appeared_tests} tests`;
    return `
      <div class="row topic-layout">
        <div class="name">${r.topic}<div class="sub">${shortLabel(r.area)}</div></div>
        ${historyBar(r, maxTotal)}
        <div class="metric">
          <div class="return-pill ${returnClass(r.current_return_mpm)}"
               onmouseenter="showTip(timeTip(r), event)"
               onmousemove="positionTip(event)"
               onmouseleave="hideTip()"
               onclick="showTip(timeTip(r), event)">
            ${returnText(r)} <span class="info-dot">i</span>
          </div>
        </div>
        <div class="metric" onmouseenter="showTip(\`${recurTip}\`, event)" onmousemove="positionTip(event)" onmouseleave="hideTip()" onclick="showTip(\`${recurTip}\`, event)">~${r.opp_per_test} marks/test<br><span>${r.appeared_tests}/5 tests</span></div>
      </div>
    `;
  }).join("") || `<div class="empty">No topic rows for this view.</div>`;

  document.getElementById("footnote").textContent = "Click/tap the time return pill to see what the minutes and MPM mean. Leakage is approximate: (incorrect + skipped) × 3 ÷ tests where the topic appeared.";
}

function render() {
  renderBreadcrumbs();
  hideTip();

  if (currentLevel === "section") renderSections();
  else if (currentLevel === "area") renderAreas();
  else renderTopics();
}

document.addEventListener("click", function(e) {
  if (!e.target.closest(".segment") && !e.target.closest(".metric")) hideTip();
});

render();
</script>
